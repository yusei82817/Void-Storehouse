<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101820">
  <title>VOID STOREHOUSE | Start Room</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #101820; color: #edf4f7; font-family: "Noto Sans JP", sans-serif; }
    #view { position: fixed; inset: 0; }
    canvas { display: block; width: 100%; height: 100%; }
    .topbar {
      position: fixed; z-index: 2; top: 18px; left: 20px;
      padding: 12px 16px; border: 1px solid #ffffff24; border-radius: 12px;
      background: #101820c9; backdrop-filter: blur(10px);
      box-shadow: 0 8px 30px #0003;
    }
    .topbar strong { display: block; font-size: 13px; letter-spacing: .16em; }
    .topbar span { display: block; margin-top: 4px; color: #a9bac4; font-size: 11px; }
    #status {
      position: fixed; z-index: 2; left: 20px; bottom: 18px;
      color: #c0d0d8; font-size: 12px; text-shadow: 0 1px 5px #000;
    }
    .hint {
      position: fixed; z-index: 2; right: 20px; bottom: 18px;
      color: #c0d0d8; font-size: 11px; text-align: right;
      text-shadow: 0 1px 5px #000;
    }
    #error {
      position: fixed; z-index: 5; inset: 0; display: none;
      place-items: center; padding: 24px; background: #101820ee;
      color: #ffd5d5; text-align: center; white-space: pre-wrap;
    }
    @media (max-width: 600px) {
      .topbar { top: 12px; left: 12px; }
      #status { left: 12px; bottom: 12px; }
      .hint { right: 12px; bottom: 12px; max-width: 48%; }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="view"></div>
  <header class="topbar">
    <strong>VOID STOREHOUSE</strong>
    <span>AREA 00 / START ROOM</span>
  </header>
  <div id="status">マップを読み込んでいます...</div>
  <div class="hint">ドラッグ：視点回転<br>ホイール：ズーム<br>右ドラッグ：平行移動</div>
  <div id="error"></div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js";

    const view = document.querySelector("#view");
    const statusElement = document.querySelector("#status");
    const errorBox = document.querySelector("#error");

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x101820);
    scene.fog = new THREE.Fog(0x101820, 35, 90);

    const camera = new THREE.PerspectiveCamera(48, 1, 0.1, 250);
    camera.position.set(17, 13, 25);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    view.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xdceeff, 0x52606a, 1.7));

    const keyLight = new THREE.DirectionalLight(0xfff1d8, 2.6);
    keyLight.position.set(-8, 19, 13);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.left = -25;
    keyLight.shadow.camera.right = 25;
    keyLight.shadow.camera.top = 25;
    keyLight.shadow.camera.bottom = -25;
    keyLight.shadow.bias = -0.0002;
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0xb9d9ff, 0.75);
    fillLight.position.set(12, 8, -10);
    scene.add(fillLight);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 3.4, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.minDistance = 5;
    controls.maxDistance = 65;
    controls.maxPolarAngle = Math.PI * 0.49;

    const geometries = {
      box: () => new THREE.BoxGeometry(1.2, 1.2, 1.2),
      plane: () => new THREE.BoxGeometry(2, 0.08, 2),
      sphere: () => new THREE.SphereGeometry(0.65, 32, 20),
      cylinder: () => new THREE.CylinderGeometry(0.55, 0.55, 1.3, 32)
    };

    function addMapObject(data) {
      const makeGeometry = geometries[data.type];
      if (!makeGeometry) return;

      const material = new THREE.MeshStandardMaterial({
        color: data.color || "#8bb8d8",
        roughness: 0.88,
        metalness: 0.02,
        side: THREE.DoubleSide
      });
      const mesh = new THREE.Mesh(makeGeometry(), material);

      mesh.position.set(data.position?.x ?? 0, data.position?.y ?? 0, data.position?.z ?? 0);
      mesh.rotation.set(
        THREE.MathUtils.degToRad(data.rotation?.x ?? 0),
        THREE.MathUtils.degToRad(data.rotation?.y ?? 0),
        THREE.MathUtils.degToRad(data.rotation?.z ?? 0)
      );
      mesh.scale.set(data.scale?.x ?? 1, data.scale?.y ?? 1, data.scale?.z ?? 1);
      mesh.castShadow = data.type !== "plane";
      mesh.receiveShadow = true;
      mesh.name = data.name || data.id || data.type;
      scene.add(mesh);
    }

    function resize() {
      const width = view.clientWidth;
      const height = view.clientHeight;
      if (!width || !height) return;
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
    }
    window.addEventListener("resize", resize);
    resize();

    async function start() {
      try {
        const response = await fetch("./Start-room.JSON", { cache: "no-store" });
        if (!response.ok) throw new Error("Start-room.JSON を取得できませんでした (" + response.status + ")");
        const map = await response.json();
        if (map.format !== "VOID_STOREHOUSE_MAP" || !Array.isArray(map.objects)) {
          throw new Error("マップJSONの形式が正しくありません。");
        }
        map.objects.forEach(addMapObject);
        statusElement.textContent = (map.mapName || "START ROOM") + " / " + map.objects.length + " OBJECTS";
      } catch (error) {
        errorBox.style.display = "grid";
        errorBox.textContent = "マップを表示できませんでした。\n" + error.message;
        statusElement.textContent = "読み込みエラー";
        console.error(error);
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
    start();
  </script>
</body>
</html>
