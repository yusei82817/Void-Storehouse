<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101820">
  <title>VOID STOREHOUSE | Start Room</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #101820; color: #edf4f7; font-family: "Noto Sans JP", sans-serif; }
    #view { position: fixed; inset: 0; }
    canvas { display: block; width: 100%; height: 100%; }
    .hud { position: fixed; z-index: 2; pointer-events: none; }
    .topbar {
      top: 18px; left: 20px; padding: 12px 16px;
      border: 1px solid #ffffff24; border-radius: 12px;
      background: #101820bd; backdrop-filter: blur(10px);
      box-shadow: 0 8px 30px #0003;
    }
    .topbar strong { display: block; font-size: 13px; letter-spacing: .16em; }
    .topbar span { display: block; margin-top: 4px; color: #a9bac4; font-size: 11px; }
    #status {
      left: 20px; bottom: 18px; color: #c0d0d8; font-size: 12px;
      text-shadow: 0 1px 5px #000;
    }
    #crosshair {
      position: fixed; z-index: 2; left: 50%; top: 50%;
      width: 8px; height: 8px; transform: translate(-50%, -50%);
      pointer-events: none; opacity: 0.85;
    }
    #crosshair::before, #crosshair::after {
      content: ""; position: absolute; background: #fff;
      box-shadow: 0 0 3px #000;
    }
    #crosshair::before { width: 8px; height: 1px; left: 0; top: 3.5px; }
    #crosshair::after { width: 1px; height: 8px; left: 3.5px; top: 0; }
    #start-screen {
      position: fixed; z-index: 4; inset: 0; display: grid; place-items: center;
      padding: 24px; background: #071018a8; backdrop-filter: blur(5px);
      cursor: pointer; text-align: center;
    }
    #start-screen[hidden] { display: none; }
    .start-card {
      width: min(440px, 100%); padding: 30px 26px;
      border: 1px solid #ffffff30; border-radius: 16px;
      background: #101c26eF; box-shadow: 0 20px 70px #0007;
    }
    .start-card h1 { margin: 0 0 8px; font-size: 19px; letter-spacing: .12em; }
    .start-card p { margin: 8px 0; color: #b9c9d2; font-size: 13px; line-height: 1.8; }
    .start-card .action { margin-top: 20px; color: #fff; font-weight: 700; }
    #error {
      position: fixed; z-index: 6; inset: 0; display: none;
      place-items: center; padding: 24px; background: #101820ee;
      color: #ffd5d5; text-align: center; white-space: pre-wrap;
    }
    @media (max-width: 600px) {
      .topbar { top: 12px; left: 12px; }
      #status { left: 12px; bottom: 12px; }
      .start-card { padding: 24px 18px; }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="view"></div>
  <header class="hud topbar">
    <strong>VOID STOREHOUSE</strong>
    <span>AREA 00 / START ROOM</span>
  </header>
  <div class="hud" id="status">マップを読み込んでいます...</div>
  <div id="crosshair" hidden></div>

  <div id="start-screen" hidden>
    <div class="start-card">
      <h1>START ROOM</h1>
      <p>WASD：移動　｜　マウス：視点操作<br>Shift：走る　｜　Esc：一時停止</p>
      <p class="action">クリックしてゲーム開始</p>
    </div>
  </div>
  <div id="error"></div>

  <script type="module">
    import * as THREE from "three";
    import { PointerLockControls } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/PointerLockControls.js";

    const view = document.querySelector("#view");
    const statusElement = document.querySelector("#status");
    const startScreen = document.querySelector("#start-screen");
    const crosshair = document.querySelector("#crosshair");
    const errorBox = document.querySelector("#error");

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x101820);
    scene.fog = new THREE.Fog(0x101820, 24, 58);

    const camera = new THREE.PerspectiveCamera(75, 1, 0.05, 180);
    camera.position.set(0, 1.65, 0);
    // PointerLockControls の初期正面を、開口部のある +Z 方向へ向ける。
    camera.rotation.order = "YXZ";
    camera.rotation.y = Math.PI;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.7));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.12;
    view.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xdceeff, 0x52606a, 1.55));

    const keyLight = new THREE.DirectionalLight(0xfff1d8, 2.15);
    keyLight.position.set(-8, 19, 13);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(1536, 1536);
    keyLight.shadow.camera.left = -22;
    keyLight.shadow.camera.right = 22;
    keyLight.shadow.camera.top = 22;
    keyLight.shadow.camera.bottom = -22;
    keyLight.shadow.bias = -0.00025;
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0xb9d9ff, 0.55);
    fillLight.position.set(12, 8, -10);
    scene.add(fillLight);

    const controls = new PointerLockControls(camera, renderer.domElement);
    controls.pointerSpeed = 0.75;
    controls.minPolarAngle = 0.08;
    controls.maxPolarAngle = Math.PI - 0.08;

    const geometries = {
      box: () => new THREE.BoxGeometry(1.2, 1.2, 1.2),
      plane: () => new THREE.BoxGeometry(2, 0.08, 2),
      sphere: () => new THREE.SphereGeometry(0.65, 32, 20),
      cylinder: () => new THREE.CylinderGeometry(0.55, 0.55, 1.3, 32)
    };

    const wallColliders = [];
    const keys = new Set();
    const clock = new THREE.Clock();
    const playerRadius = 0.34;
    const playerHeight = 1.7;
    let mapLoaded = false;

    function addMapObject(data) {
      const makeGeometry = geometries[data.type];
      if (!makeGeometry) return;

      const mesh = new THREE.Mesh(
        makeGeometry(),
        new THREE.MeshStandardMaterial({
          color: data.color || "#8bb8d8",
          roughness: 0.9,
          metalness: 0.01,
          side: THREE.DoubleSide
        })
      );

      mesh.position.set(data.position?.x ?? 0, data.position?.y ?? 0, data.position?.z ?? 0);
      mesh.rotation.set(
        THREE.MathUtils.degToRad(data.rotation?.x ?? 0),
        THREE.MathUtils.degToRad(data.rotation?.y ?? 0),
        THREE.MathUtils.degToRad(data.rotation?.z ?? 0)
      );
      mesh.scale.set(data.scale?.x ?? 1, data.scale?.y ?? 1, data.scale?.z ?? 1);
      mesh.castShadow = data.type === "box";
      mesh.receiveShadow = true;
      mesh.name = data.name || data.id || data.type;
      scene.add(mesh);

      // 壁として使われている箱だけを衝突対象にする。床・天井は除外。
      if (data.type === "box") {
        mesh.updateMatrixWorld(true);
        const bounds = new THREE.Box3().setFromObject(mesh);
        if (bounds.max.y > 0.15 && bounds.min.y < playerHeight) {
          wallColliders.push({
            minX: bounds.min.x,
            maxX: bounds.max.x,
            minZ: bounds.min.z,
            maxZ: bounds.max.z
          });
        }
      }
    }

    function collides(x, z) {
      for (const wall of wallColliders) {
        const nearestX = Math.max(wall.minX, Math.min(x, wall.maxX));
        const nearestZ = Math.max(wall.minZ, Math.min(z, wall.maxZ));
        const dx = x - nearestX;
        const dz = z - nearestZ;
        if (dx * dx + dz * dz < playerRadius * playerRadius) return true;
      }
      return false;
    }

    function movePlayer(dx, dz) {
      const nextX = camera.position.x + dx;
      if (!collides(nextX, camera.position.z)) camera.position.x = nextX;

      const nextZ = camera.position.z + dz;
      if (!collides(camera.position.x, nextZ)) camera.position.z = nextZ;
    }

    function resize() {
      const width = view.clientWidth;
      const height = view.clientHeight;
      if (!width || !height) return;
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
    }
    window.addEventListener("resize", resize);
    resize();

    function showStartScreen() {
      startScreen.hidden = false;
      crosshair.hidden = true;
    }

    startScreen.addEventListener("click", () => {
      if (mapLoaded) controls.lock();
    });

    controls.addEventListener("lock", () => {
      startScreen.hidden = true;
      crosshair.hidden = false;
      statusElement.textContent = "AREA 00 / START ROOM";
    });

    controls.addEventListener("unlock", () => {
      keys.clear();
      showStartScreen();
    });

    window.addEventListener("keydown", (event) => {
      if (["KeyW", "KeyA", "KeyS", "KeyD", "ShiftLeft", "ShiftRight"].includes(event.code)) {
        event.preventDefault();
      }
      keys.add(event.code);
    });

    window.addEventListener("keyup", (event) => keys.delete(event.code));
    window.addEventListener("blur", () => keys.clear());

    async function start() {
      try {
        const response = await fetch("./Start-room.JSON", { cache: "no-store" });
        if (!response.ok) {
          throw new Error("Start-room.JSON を取得できませんでした (" + response.status + ")");
        }

        const map = await response.json();
        if (map.format !== "VOID_STOREHOUSE_MAP" || !Array.isArray(map.objects)) {
          throw new Error("マップJSONの形式が正しくありません。");
        }

        map.objects.forEach(addMapObject);
        mapLoaded = true;
        statusElement.textContent = (map.mapName || "START ROOM") + " / WASD TO MOVE";
        showStartScreen();
      } catch (error) {
        errorBox.style.display = "grid";
        errorBox.textContent = "マップを表示できませんでした。\n" + error.message;
        statusElement.textContent = "読み込みエラー";
        console.error(error);
      }
    }

    function updateMovement(delta) {
      if (!controls.isLocked) return;

      const forwardInput = Number(keys.has("KeyW")) - Number(keys.has("KeyS"));
      const sideInput = Number(keys.has("KeyD")) - Number(keys.has("KeyA"));
      if (!forwardInput && !sideInput) return;

      const direction = new THREE.Vector3();
      camera.getWorldDirection(direction);
      direction.y = 0;
      direction.normalize();

      const right = new THREE.Vector3().crossVectors(direction, camera.up).normalize();
      const move = new THREE.Vector3()
        .addScaledVector(direction, forwardInput)
        .addScaledVector(right, sideInput);

      if (move.lengthSq() > 1) move.normalize();
      const running = keys.has("ShiftLeft") || keys.has("ShiftRight");
      const speed = running ? 6.0 : 3.2;
      move.multiplyScalar(speed * delta);
      movePlayer(move.x, move.z);
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.05);
      updateMovement(delta);
      renderer.render(scene, camera);
    }

    animate();
    start();
  </script>
</body>
</html>
